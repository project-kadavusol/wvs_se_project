<!DOCTYPE html>
<html lang="en">
<head>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HECKTO-Login</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@1/css/pico.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <div class="grid-container">
        <div class="login-box">
            {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="flash-messages">
                    {% for category, message in messages %}
                        <div class="flash-message {{ category }}">{{ message }}</div>
                    {% endfor %}
                </div>
            {% endif %}
            {% endwith %}

            <h2>HECKTO-Login</h2>

            <!-- Error Message Div -->
            <div id="formError"></div>

            <form action="{{ url_for('login') }}" method="post" onsubmit="return validateForm()">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required>

                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>

                <button type="submit">Login</button>
            </form>
            
            <p class="switch">Don't have an account? <a href="{{ url_for('signup') }}">Sign Up</a></p>
        </div>
    </div>

    <script>
        function validateForm() {
            let username = document.getElementById("username").value.trim();
            let password = document.getElementById("password").value.trim();
            let errorDiv = document.getElementById("formError");

            // Clear previous errors
            errorDiv.innerText = "";
            errorDiv.style.display = "none";

            if (username === "" || password === "") {
                errorDiv.innerText = "Both username and password are required!";
                errorDiv.style.display = "block";
                return false;
            }
            return true;
        }

        setTimeout(function() {
            let messageContainer = document.querySelector('.flash-messages');
            if (messageContainer) messageContainer.remove();
        }, 5000);
    </script>
</body>
</html>
